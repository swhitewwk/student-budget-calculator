<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f2">
  <title>每日记账 · 大学生生活费计算器</title>
  <style>
    :root{color-scheme:light;--ink:#20231f;--muted:#777c73;--line:#e8e9e2;--paper:#fff;--bg:#f7f7f2;--green:#315d45;--green2:#e8f0e9;--orange:#dc7447;--shadow:0 18px 55px #33452a0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}button,input,select{font:inherit}.page{max-width:960px;margin:0 auto;padding:42px 28px 56px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:46px}.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.02em}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:white}.brandmark svg{width:19px}.nav{display:flex;gap:6px;align-items:center}.nav a{font-size:12px;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:99px}.nav a:hover{background:#e9ece5;color:var(--green)}.nav a[aria-current=page]{background:var(--green2);color:var(--green);font-weight:650}.intro{margin-bottom:26px}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.14em;margin:0 0 10px}.intro h1{font-size:clamp(30px,5vw,42px);line-height:1.18;letter-spacing:-.04em;margin:0 0 12px}.intro p{margin:0;color:var(--muted);font-size:15px}.grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;align-items:start}.card{background:var(--paper);border:1px solid #ededE7;border-radius:20px;box-shadow:var(--shadow)}.form-card{padding:22px}.card-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 17px}.card-head h2{font-size:16px;margin:0}.card-head span{font-size:12px;color:var(--muted)}.field{display:block;margin:13px 0}.field span{display:block;margin-bottom:6px;font-size:12px;color:#636960;font-weight:600}.field input,.field select{width:100%;height:44px;border:1px solid #e1e3dc;border-radius:11px;background:#fff;padding:0 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #315d4514}.submit{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:12px;font-weight:650;cursor:pointer;margin-top:6px}.submit:hover{background:#254a36}.month-total{margin-top:14px;background:var(--green2);border-radius:13px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;color:var(--green);font-size:13px}.month-total strong{font-size:18px}.savings-month-total{background:#f5f6f1;color:#424a40}.savings-month-total strong{font-size:16px}.balance-card{padding:22px 24px}.balance-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.balance-head h2{font-size:16px;margin:0}.balance-head span{font-size:12px;color:var(--muted)}.balances{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance{padding:13px 14px;background:#f8f8f5;border:1px solid #f0f0ea;border-radius:13px}.balance.over{background:#fff3ed;border-color:#f7ded2}.balance-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:650}.balance-top small{font-size:11px;color:var(--muted);font-weight:400}.balance-left{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}.balance.over .balance-left{color:#b64e27}.balance-meta{font-size:11px;color:var(--muted);margin-top:2px}.history{margin-top:18px;padding:22px 24px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.history-head h2{font-size:16px;margin:0}.history-head span{font-size:12px;color:var(--muted)}.entries{display:flex;flex-direction:column}.entry{display:grid;grid-template-columns:minmax(100px,.7fr) minmax(100px,.8fr) 1fr auto auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 2px;font-size:13px}.entry-date{color:var(--muted);font-variant-numeric:tabular-nums}.entry-name{font-weight:650}.entry-note{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry-amount{font-weight:700;font-variant-numeric:tabular-nums}.delete{border:1px solid #e5e5df;background:white;color:#777c73;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}.delete:hover{color:#a13d20;border-color:#e8b49f}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:13px}.footnote{margin:16px 2px 0;color:#8c9088;font-size:12px}.alert{display:none;margin-top:15px;padding:12px 14px;background:#ffebe1;color:#8c3e20;border:1px solid #f6d5c5;border-radius:13px;font-size:13px;font-weight:650}.alert.show{display:block}@media(max-width:700px){.page{padding:24px 16px 38px}.topline{margin-bottom:34px}.grid{grid-template-columns:1fr;gap:14px}.balance-card,.history{padding:19px}.intro{margin-bottom:20px}}@media(max-width:460px){.page{padding-inline:12px}.brand{font-size:13px}.nav a{padding:7px 8px}.balances{grid-template-columns:1fr 1fr;gap:8px}.balance{padding:11px}.entry{grid-template-columns:1fr auto auto;gap:6px 10px;padding:11px 2px}.entry-date{grid-column:1}.entry-name{grid-column:1;grid-row:2}.entry-note{grid-column:1;grid-row:3}.entry-amount{grid-column:2;grid-row:1/3}.delete{grid-column:3;grid-row:1/3}.entry{font-size:12px}}
  .form-actions{display:flex;gap:8px;margin-top:6px}.submit{flex:1;border:0;border-radius:11px;background:var(--green);color:#fff;padding:12px;font-weight:650;cursor:pointer;margin:0}.submit:hover{background:#254a36}.cancel-edit{display:none;border:1px solid #dedfd8;background:white;color:#555b53;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:600;cursor:pointer}.cancel-edit.show{display:block}.entry{grid-template-columns:minmax(100px,.7fr) minmax(100px,.8fr) 1fr auto auto auto}.entry-actions{display:flex;gap:5px}.entry-action{border:1px solid #e5e5df;background:white;color:#667064;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}.entry-action:hover{color:var(--green);border-color:#aeb8ad}@media(max-width:460px){.entry{grid-template-columns:1fr auto auto;gap:6px 10px}.entry-amount{grid-column:2;grid-row:1/3}.entry-actions{grid-column:3;grid-row:1/3;flex-direction:column}.entry-action{padding:5px 6px}}
  .balance{cursor:pointer;transition:border-color .15s,box-shadow .15s}.balance:hover,.balance:focus-visible{border-color:#aeb8ad;outline:none}.balance.active{border-color:var(--green);box-shadow:0 0 0 2px #315d4517}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}.filter-btn{border:1px solid #e5e6df;background:#fff;color:#697066;border-radius:99px;padding:6px 11px;font-size:11px;cursor:pointer}.filter-btn.active{background:var(--green2);border-color:#c9d9ca;color:var(--green);font-weight:650}.filter-btn:hover{border-color:#aeb8ad}
  </style>
</head>
<body><main class="page">
  <header class="topline"><div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6M3 19h18"/></svg></span><span>校园生活 · 预算计划</span></div><nav class="nav" aria-label="主导航"><a href="index.html">月度预算</a><a href="daily.html" aria-current="page">每日记账</a></nav></header>
  <section class="intro"><p class="eyebrow">DAILY EXPENSE TRACKER</p><h1>每天花了多少？</h1><p>记下每一笔日常开销，随时看看各分类还剩多少预算。</p></section>
  <div class="grid">
    <section class="card form-card"><div class="card-head"><h2>记一笔开销</h2><span>本月记账</span></div><form id="entry-form"><label class="field"><span>日期</span><input id="date" type="date" required></label><label class="field"><span>支出分类</span><select id="category" required></select></label><label class="field"><span>金额（元）</span><input id="amount" type="number" min="0.01" step="0.01" placeholder="例如 18" inputmode="decimal" required></label><label class="field"><span>备注（选填）</span><input id="note" type="text" maxlength="40" placeholder="例如：午餐"></label><div class="form-actions"><button class="submit" id="submit-button" type="submit">添加这笔开销</button><button class="cancel-edit" id="cancel-edit" type="button">取消修改</button></div></form><div class="month-total"><span>本月已记录</span><strong id="month-total">¥0</strong></div><div class="month-total savings-month-total"><span>当前总存款（含储蓄记账）</span><strong id="current-savings">¥0</strong></div></section>
    <section class="card balance-card"><div class="balance-head"><h2>各分类剩余可用</h2><span id="month-label"></span></div><div class="balances" id="balances"></div><div class="alert" id="alert" role="status">部分分类已超出月度安排，请留意红色金额。</div></section>
  </div>
  <section class="card history"><div class="history-head"><h2 id="history-title">开销记录</h2><span id="record-count">0 笔</span></div><div class="filters" id="filters" aria-label="按分类筛选"></div><div class="entries" id="entries"></div></section>
  <p class="footnote">记录仅保存在当前浏览器中，不会上传或收集个人信息。删除记录后，各分类剩余金额会立即更新。</p>
</main>
<script>
(()=>{
 const defaults={budget:0,categories:{饭卡:0,交通:0,话费:0,日用品:0,社交:0,储蓄:0,应急:0}},categories=Object.keys(defaults.categories),settingsKey='student-budget-settings',entriesKey='student-budget-entries';
 const $=selector=>document.querySelector(selector),date=$('#date'),form=$('#entry-form'),catSelect=$('#category'),amount=$('#amount'),note=$('#note'),balances=$('#balances'),entriesEl=$('#entries'),submitButton=$('#submit-button'),cancelButton=$('#cancel-edit');
 const today=new Date(),month=String(today.getMonth()+1).padStart(2,'0'),monthKey=String(today.getFullYear())+'-'+month;let editingId=null,activeCategory='全部';
 const money=n=>'¥'+new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n);date.value=String(today.getFullYear())+'-'+month+'-'+String(today.getDate()).padStart(2,'0');
 $('#month-label').textContent=String(today.getFullYear())+'年'+Number(month)+'月 · 点分类看记录';
 for(const name of categories){const option=document.createElement('option');option.value=name;option.textContent=name;catSelect.append(option)}
 function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
 function saveEntries(list){try{localStorage.setItem(entriesKey,JSON.stringify(list))}catch{}}
 function getSettings(){const saved=load(settingsKey,null);return{savings:Number(saved?.savings||0),categories:{...defaults.categories,...(saved?.categories||{})}}}
 function stopEditing(){editingId=null;form.reset();date.value=String(today.getFullYear())+'-'+month+'-'+String(today.getDate()).padStart(2,'0');submitButton.textContent='添加这笔开销';cancelButton.classList.remove('show')}
 function render(){
  const cfg=getSettings(),all=load(entriesKey,[]),thisMonth=all.filter(e=>e.date?.startsWith(monthKey)),totals=Object.fromEntries(categories.map(c=>[c,thisMonth.filter(e=>e.category===c).reduce((sum,e)=>sum+Number(e.amount||0),0)]));
  $('#month-total').textContent=money(thisMonth.reduce((sum,e)=>sum+Number(e.amount||0),0));$('#current-savings').textContent=money(Math.max(0,Number(cfg.savings)||0)+all.filter(e=>e.category==='储蓄').reduce((sum,e)=>sum+Number(e.amount||0),0));balances.replaceChildren();let over=false;
  for(const c of categories){const spent=totals[c],left=Number(cfg.categories[c]||0)-spent,card=document.createElement('div');card.className='balance'+(left<0?' over':'')+(activeCategory===c?' active':'');card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-pressed',String(activeCategory===c));card.setAttribute('aria-label','查看'+c+'记录');if(left<0)over=true;const choose=()=>{activeCategory=c;render()};card.addEventListener('click',choose);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose()}});const top=document.createElement('div');top.className='balance-top';const title=document.createElement('span');title.textContent=c;const planned=document.createElement('small');planned.textContent='安排 '+money(Number(cfg.categories[c]||0));top.append(title,planned);const leftEl=document.createElement('div');leftEl.className='balance-left';leftEl.textContent=left<0?'超出 '+money(Math.abs(left)):money(left);const meta=document.createElement('div');meta.className='balance-meta';meta.textContent='已记 '+money(spent);card.append(top,leftEl,meta);balances.append(card)}
  $('#alert').classList.toggle('show',over);const filters=$('#filters');filters.replaceChildren();for(const label of ['全部',...categories]){const button=document.createElement('button');button.type='button';button.className='filter-btn'+(activeCategory===label?' active':'');button.textContent=label;button.setAttribute('aria-pressed',String(activeCategory===label));button.addEventListener('click',()=>{activeCategory=label;render()});filters.append(button)}
  entriesEl.replaceChildren();const sorted=[...all].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt),visible=activeCategory==='全部'?sorted:sorted.filter(e=>e.category===activeCategory);$('#history-title').textContent=activeCategory==='全部'?'开销记录':activeCategory+'记录';$('#record-count').textContent=visible.length+' 笔';
  if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=activeCategory==='全部'?'还没有开销记录，记下今天的第一笔吧。':'这个分类还没有记录。';entriesEl.append(empty);return}
  for(const e of visible){const row=document.createElement('div');row.className='entry';const d=document.createElement('span');d.className='entry-date';d.textContent=e.date;const c=document.createElement('span');c.className='entry-name';c.textContent=e.category;const n=document.createElement('span');n.className='entry-note';n.textContent=e.note||'日常开销';const a=document.createElement('span');a.className='entry-amount';a.textContent=money(Number(e.amount));const actions=document.createElement('span');actions.className='entry-actions';const edit=document.createElement('button');edit.className='entry-action';edit.type='button';edit.textContent='编辑';edit.addEventListener('click',()=>{editingId=e.id;date.value=e.date;catSelect.value=e.category;amount.value=e.amount;note.value=e.note||'';submitButton.textContent='保存修改';cancelButton.classList.add('show');form.scrollIntoView({behavior:'smooth',block:'center'});amount.focus()});const del=document.createElement('button');del.className='entry-action';del.type='button';del.textContent='删除';del.addEventListener('click',()=>{saveEntries(load(entriesKey,[]).filter(x=>x.id!==e.id));if(editingId===e.id)stopEditing();render()});actions.append(edit,del);row.append(d,c,n,a,actions);entriesEl.append(row)}
 } form.addEventListener('submit',event=>{event.preventDefault();const value=Number(amount.value);if(!date.value||!Number.isFinite(value)||value<=0)return;const list=load(entriesKey,[]);if(editingId){const index=list.findIndex(e=>e.id===editingId);if(index<0){stopEditing();render();return}list[index]={...list[index],date:date.value,category:catSelect.value,amount:value,note:note.value.trim(),updatedAt:Date.now()}}else{list.push({id:crypto.randomUUID?.()||String(Date.now())+'-'+Math.random(),date:date.value,category:catSelect.value,amount:value,note:note.value.trim(),createdAt:Date.now()})}saveEntries(list);stopEditing();render()});
 cancelButton.addEventListener('click',stopEditing);window.addEventListener('storage',event=>{if(event.key===settingsKey||event.key===entriesKey)render()});render()
})();
</script></body></html>
